services:

  # ==========================================
  # PostgreSQL - Main Application Database
  # ==========================================

  postgres:
    image: postgres:17
    container_name: smart-support-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: smart_support
      POSTGRES_USER: smart_support_user
      POSTGRES_PASSWORD: smart_support_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U smart_support_user -d smart_support" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MySQL - Legacy Order Database
  # ==========================================

  mysql:
    image: mysql:8.4
    container_name: smart-support-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: legacy_orders
      MYSQL_USER: legacy_user
      MYSQL_PASSWORD: legacy_password
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MongoDB - Conversations / Events
  # ==========================================

  mongodb:
    image: mongo:8
    container_name: smart-support-mongodb

    restart: unless-stopped

    environment:
      MONGO_INITDB_DATABASE: smart_support

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # RabbitMQ - Message Broker
  # ==========================================

  rabbitmq:
    image: rabbitmq:4-management
    container_name: smart-support-rabbitmq

    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: smart_support
      RABBITMQ_DEFAULT_PASS: smart_support_password

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Qdrant - Vector Database
  # ==========================================

  qdrant:
    image: qdrant/qdrant:latest
    container_name: smart-support-qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

# ==========================================
# Persistent Volumes
# ==========================================

volumes:

  postgres_data:
    name: smart-support-postgres-data

  mysql_data:
    name: smart-support-mysql-data

  mongodb_data:
    name: smart-support-mongodb-data

  rabbitmq_data:
    name: smart-support-rabbitmq-data

  qdrant_data:
    name: smart-support-qdrant-data
